# Release — build the LÖVE game as a signed, notarised macOS app and attach it
# to a GitHub release.
#
# Triggered by pushing a tag like `v0.1.0`, which must match the version of
# record — `make version`, which prints the number only once rust/Cargo.toml
# and omok/__init__.py agree on it. Or manually via workflow_dispatch for a dry
# run that uploads the artifact without creating a release.
#
#   macos-latest → dist/CausewaybayOmok-<version>-<arch>-apple-darwin.zip
#                  dist/SHA256SUMS
#
# The recipe is the Makefiles', not this file's: `make package` builds the
# Rust/MLX core, downloads LÖVE, embeds the game, the core, its Metal kernels
# and the shipped model, signs inside-out, checks the archive carries every
# module and zips it into dist/; `make notarize` sends the bundle to Apple and
# staples the ticket. Everything here is credentials and plumbing, so that
# `make package && make notarize && make dist` on a laptop and a tagged
# release do the same thing.
#
# Signing uses the Developer ID certificate from the repository secrets
# (MACOS_CERTIFICATE_P12_BASE64 / MACOS_CERTIFICATE_PASSWORD) and notarisation
# uses APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / TEAM_ID. Without the secrets
# everything falls back to ad-hoc signing, so a fork's dry run still produces
# a bundle — one that opens where it was built and nowhere else.
#
# Apple Silicon only. The core is MLX, which is Metal, which is not a thing a
# macOS-13 Intel runner has; `macos-latest` has been arm64 since macOS 14.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package the LÖVE app (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the version development happens on.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      # MLX is most of the build: cmake compiles the framework and every Metal
      # kernel on the first run, which is minutes. The cache makes the second
      # tag cheap.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      # MLX compiles its kernels with the `metal` compiler, which ships with
      # Xcode — and, from Xcode 26 on, as a component Xcode downloads on
      # request. The root Makefile already points DEVELOPER_DIR at
      # /Applications/Xcode.app; this makes sure the compiler is inside it.
      - name: Ensure the Metal compiler
        run: |
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          if ! xcrun -sdk macosx metal --version > /dev/null 2>&1; then
            echo "metal compiler missing; downloading the Metal toolchain"
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      # `make version` fails outright when the two manifests disagree, so this
      # settles both questions at once: one version, and it is the tagged one.
      - name: Resolve the version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(make version)
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match the version of record $version" >&2
            echo "bump rust/Cargo.toml and omok/__init__.py, or retag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      # Imports the Developer ID certificate into a throwaway keychain and
      # exports APPLE_SIGNING_IDENTITY for the build. Falls back to ad-hoc
      # signing when the secret is absent (e.g. a fork's dry run).
      - name: Import codesigning certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::MACOS_CERTIFICATE_P12_BASE64 not set, using ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          CERT_INFO=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" || true)
          if [ -n "$CERT_INFO" ]; then
            CERT_ID=$(echo "$CERT_INFO" | head -1 | awk -F'"' '{print $2}')
            echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
            echo "Found certificate: $CERT_ID"
          else
            echo "::warning::No Developer ID Application certificate found, using ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      # `make package` reads APPLE_SIGNING_IDENTITY, builds the release core,
      # downloads LÖVE, embeds the game, signs inside-out, checks the archive
      # carries every module, and puts the zip in dist/ under its release name.
      #
      # The smoke test it normally runs is skipped: it starts the bundle and
      # waits for a frame, and a runner has no window server to draw into.
      # `verify-archive` still runs and catches a module left out of the
      # staging deterministically.
      - name: Build, sign and package the app
        run: make package SKIP_SMOKE=1

      # Only with a real certificate: Apple refuses an ad-hoc signature, and a
      # fork's dry run has no secrets. The Makefile checks this too and would
      # stop before uploading; this keeps the log honest about why.
      - name: Notarize and staple
        if: env.APPLE_SIGNING_IDENTITY != '-'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: make notarize

      # What a person downloading it will actually get. Printed either way,
      # because "signed but not notarised" is the state worth seeing in a log.
      - name: Assess with Gatekeeper
        run: make gatekeeper

      # Notarising re-zipped the stapled bundle, so dist/ is refreshed from it;
      # without a certificate this is a no-op copy of what `make package` made.
      - name: Refresh dist/ with the stapled bundle
        run: make dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: causewaybay-omok-macos-${{ steps.version.outputs.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"

  release:
    name: Create GitHub release
    needs: [package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            **Causewaybay Omok** — the LÖVE game with the trained model inside,
            as a double-clickable macOS app. Signed and notarised; Apple Silicon.

            | archive | what is inside |
            | --- | --- |
            | `CausewaybayOmok-…-apple-darwin.zip` | `CausewaybayOmok.app`: LÖVE 11.5, the game, the Rust/MLX engine with its Metal kernels, and the `base` model |

            Verify a download against `SHA256SUMS`, unzip, and open the app.
            Nothing else is needed — no LÖVE, no Python, no checkout.
